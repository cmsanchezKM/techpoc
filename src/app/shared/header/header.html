<header class="pt-[1.4rem] px-9 pb-3">
  <div class="flex items-center justify-between min-h-16">
    <div
      class="text-lg font-extrabold tracking-tighter cursor-pointer text-brand-primary"
      routerLink="/"
    >
      {{ 'header.title' | transloco }}
    </div>

    <div class="flex items-center gap-8 ml-auto">
      @if (showSearch()) {
        <app-search-input
          [value]="searchValue()"
          (valueChange)="searchChange.emit($event)"
          [placeholder]="searchPlaceholder()"
          [ariaLabel]="searchAriaLabel()"
        />
      }

      <app-language-switcher [current]="currentLang()" (langChange)="langChange.emit($event)" />
      <app-auth-button
        [isAuthenticated]="isAuthenticated()"
        (login)="login.emit()"
        (logout)="logout.emit()"
      />
    </div>
  </div>
</header>
