<header class="pt-[1.4rem] px-9 pb-3">
  <div class="flex items-center justify-between min-h-16">
    <div
      class="text-lg font-extrabold tracking-tighter cursor-pointer text-brand-primary"
      routerLink="/"
    >
      TechPoC
    </div>

    <div class="flex items-center gap-4 ml-auto">
      @if (isPostsListPage()) {
        <div
          class="bg-brand-surface border border-brand-line flex items-center px-3.25 py-1.75 rounded w-80"
        >
          <app-icon
            name="search"
            stroke-width="0"
            viewBox="-2 -2 15 15"
            class="h-5 w-5 shrink-0 text-brand-secondary pointer-events-none"
          />
          <input
            type="search"
            class="w-full pl-3 bg-transparent border-0 text-sm text-brand-secondary placeholder:text-brand-secondary focus:outline-none"
            [value]="filters.searchTerm()"
            (input)="onSearchInput($event)"
            [placeholder]="'posts.list.placeholder' | transloco"
            [attr.aria-label]="'posts.list.search' | transloco"
          />
        </div>
      }

      <div
        class="inline-flex items-center bg-brand-tag rounded-full p-1.5 shadow-[inset_0_0_0_1px_rgba(17,17,17,0.06)]"
        [attr.aria-label]="'header.languageSelector' | transloco"
      >
        <button
          type="button"
          class="lang-option border-0 bg-transparent text-brand-secondary text-[0.9rem] font-bold leading-none px-5 py-2.5 rounded-full cursor-pointer transition-all duration-200"
          [class.is-active]="lang.current() === 'es'"
          (click)="changeLang('es')"
          [attr.aria-pressed]="lang.current() === 'es'"
        >
          ES
        </button>
        <button
          type="button"
          class="lang-option border-0 bg-transparent text-brand-secondary text-[0.9rem] font-bold leading-none px-5 py-2.5 rounded-full cursor-pointer transition-all duration-200"
          [class.is-active]="lang.current() === 'en'"
          (click)="changeLang('en')"
          [attr.aria-pressed]="lang.current() === 'en'"
        >
          EN
        </button>
      </div>

      @if (auth.isAuthenticated()) {
        <button
          type="button"
          class="inline-flex items-center gap-2 bg-transparent text-brand-primary cursor-pointer p-0"
          [attr.aria-label]="'header.logout' | transloco"
          (click)="logout()"
        >
          <app-icon name="log" class="h-5 w-5" />
          <span>{{ 'header.logout' | transloco }}</span>
        </button>
      } @else {
        <button
          type="button"
          class="inline-flex items-center gap-2 bg-transparent text-brand-primary cursor-pointer p-0"
          [attr.aria-label]="'header.login' | transloco"
          (click)="login()"
        >
          <app-icon name="log" class="h-5 w-5" />
        </button>
      }
    </div>
  </div>
</header>
