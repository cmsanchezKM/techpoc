<div
  class="min-h-screen flex items-center justify-center bg-app-background px-4 py-12"
  *transloco="let t"
>
  <div class="w-full max-w-md">
    <!-- Encabezado -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-brand-title mb-2">{{ t('auth.login.title') }}</h1>
      <p class="text-sm text-brand-muted">{{ t('auth.login.subtitle') }}</p>
    </div>

    <!-- Formulario -->
    <div class="bg-brand-surface-variant rounded-lg shadow-sm p-8">
      <!-- Mensaje de error -->
      @if (error()) {
        <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
          <div class="flex items-start gap-3">
            <app-icon name="alert-circle" class="h-5 w-5 text-red-600 shrink-0 mt-0.5" />
            <div class="flex-1">
              <p class="text-sm text-red-800 font-medium">{{ error() }}</p>
            </div>
            <button
              type="button"
              (click)="clearError()"
              class="text-red-400 hover:text-red-600 transition-colors"
              aria-label="Cerrar mensaje de error"
            >
              <app-icon name="x" class="h-4 w-4" />
            </button>
          </div>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Campo Usuario -->
        <div class="mb-6">
          <label for="username" class="block text-xs font-medium text-brand-body uppercase mb-2">
            {{ t('auth.login.username') }}
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <app-icon name="user" class="h-5 w-5 text-brand-muted" />
            </div>
            <input
              id="username"
              type="text"
              formControlName="username"
              [placeholder]="t('auth.login.usernamePlaceholder')"
              [disabled]="loading()"
              class="w-full pl-10 pr-3 py-2.5 bg-brand-surface border-0 rounded text-brand-title placeholder-brand-muted focus:outline-none focus:ring-2 focus:ring-brand-accent disabled:opacity-50 disabled:cursor-not-allowed"
              aria-required="true"
            />
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="mb-6">
          <label for="password" class="block text-xs font-medium text-brand-body uppercase mb-2">
            {{ t('auth.login.password') }}
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <app-icon name="lock" class="h-5 w-5 text-brand-muted" />
            </div>
            <input
              id="password"
              type="password"
              formControlName="password"
              [placeholder]="t('auth.login.passwordPlaceholder')"
              [disabled]="loading()"
              class="w-full pl-10 pr-3 py-2.5 bg-brand-surface border-0 rounded text-brand-title placeholder-brand-muted focus:outline-none focus:ring-2 focus:ring-brand-accent disabled:opacity-50 disabled:cursor-not-allowed"
              aria-required="true"
            />
          </div>
        </div>

        <!-- Botón Acceder -->
        <button
          type="submit"
          [disabled]="!loginForm.valid || loading()"
          class="w-full flex items-center justify-center gap-2 bg-brand-accent text-white py-3 px-4 rounded font-medium hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-brand-accent focus:ring-offset-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
          [attr.aria-label]="t('auth.login.submitAriaLabel')"
        >
          @if (loading()) {
            <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
            <span>{{ t('auth.login.loading') || 'Cargando...' }}</span>
          } @else {
            <span>{{ t('auth.login.submit') }}</span>
            <app-icon name="arrow-right" class="h-4 w-4" />
          }
        </button>
      </form>

      <!-- Información de ayuda -->
      <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
        <div class="flex items-start gap-3">
          <app-icon name="info" class="h-5 w-5 text-blue-600 shrink-0 mt-0.5" />
          <div class="text-sm text-blue-800">
            <p class="font-medium mb-1">{{ t('auth.login.help.title') || 'Ayuda' }}</p>
            <p>{{ t('auth.login.help.message') || 'Usa el nombre de usuario como contraseña' }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
